    <script>
      (function() {
        // Intercept and suppress external browser extension noise (MetaMask, Phantom, Web3 inpage scripts)
        function isExtensionError(msg, stack, source) {
          var str = ((msg || '') + ' ' + (stack || '') + ' ' + (source || '')).toLowerCase();
          return (
            str.indexOf('metamask') !== -1 ||
            str.indexOf('inpage.js') !== -1 ||
            str.indexOf('chrome-extension://') !== -1 ||
            str.indexOf('ethereum') !== -1 ||
            str.indexOf('failed to connect') !== -1
          );
        }

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason || {};
          var msg = reason.message || String(reason);
          var stack = reason.stack || '';
          if (isExtensionError(msg, stack, '')) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.stopPropagation) event.stopPropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = event.message || '';
          var stack = (event.error && event.error.stack) || '';
          var source = event.filename || '';
          if (isExtensionError(msg, stack, source)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.stopPropagation) event.stopPropagation();
            return true;
          }
        }, true);

        // Filter console.error for third-party extension injection failures
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var str = args.map(function(a) {
            return (typeof a === 'object' && a !== null) ? (a.message || a.stack || JSON.stringify(a) || '') : String(a);
          }).join(' ');
          if (isExtensionError(str, '', '')) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };
      })();
    </script>
